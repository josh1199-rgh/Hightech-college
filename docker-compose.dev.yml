version: '3.8'

services:
  app:
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - HMR=true
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./server:/app/server
  postgres:
    ports:
      - "5432:5432"
  redis:
    ports:
      - "6379:6379"
  nginx:
    ports:
      - "8080:80"